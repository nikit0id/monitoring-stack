name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration and alert rules
        run: |
          scripts/init-env
          set -a
          source .env
          set +a
          scripts/render
          docker compose config -q
          shellcheck scripts/init-env scripts/up scripts/verify
          docker run --rm -v "$PWD/prometheus:/rules:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /rules/alerts.yml
        env:
          API_NETWORK: portfolio-api_default

      - uses: actions/checkout@v4
        with:
          repository: nikit0id/portfolio-api
          ref: 16b7da9ccb89279e4e3469fde974613fc464625e
          path: api
      - name: Start the real API
        working-directory: api
        run: |
          scripts/init-env
          docker compose -p portfolio-api up -d --build --wait
      - name: Verify dashboard, scrape and incident delivery
        run: |
          export LOG_PROBE="portfolio-ci-log-$GITHUB_RUN_ID"
          echo "$LOG_PROBE" | sudo tee /var/log/portfolio-monitoring-check.log >/dev/null
          scripts/up
          scripts/verify
