services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./.runtime/discovery:/etc/prometheus/discovery:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:${PROM_PORT:-9090}:9090"]
    networks: [default, api_net]
  node:
    image: prom/node-exporter:v1.9.1
    pid: host
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/textfile"]
    volumes:
      - /:/host:ro
      - ${BACKUP_METRICS_DIR:-./.runtime/textfile}:/textfile:ro
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/config/blackbox.yml"]
    volumes: ["./blackbox.yml:/config/blackbox.yml:ro"]
    networks: [default, api_net]
  receiver:
    image: python:3.12-alpine
    user: "65534:65534"
    volumes: ["./receiver.py:/receiver.py:ro"]
    command: ["python", "-B", "/receiver.py"]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/config.json", "--storage.path=/alertmanager"]
    volumes:
      - ./.runtime/alertmanager.json:/etc/alertmanager/config.json:ro
      - ./.runtime/telegram-token:/run/secrets/telegram_token:ro
      - alertdata:/alertmanager
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run scripts/init-env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/dashboards:ro
      - grafanadata:/var/lib/grafana
  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/portfolio.yml"]
    volumes:
      - ./logs/loki.yml:/etc/loki/portfolio.yml:ro
      - lokidata:/loki
  promtail:
    image: grafana/promtail:3.5.0
    command: ["-config.file=/etc/promtail/portfolio.yml"]
    volumes:
      - ./logs/promtail.yml:/etc/promtail/portfolio.yml:ro
      - /var/log:/hostlogs:ro
      - positions:/positions
networks:
  api_net:
    external: true
    name: ${API_NETWORK:-portfolio-api_default}
volumes:
  promdata:
  alertdata:
  grafanadata:
  lokidata:
  positions:
